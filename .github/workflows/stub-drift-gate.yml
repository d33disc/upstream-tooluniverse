# Stub drift gate
#
# Guards the invariant restored by PR #64: a forced regeneration of the
# auto-generated coding-API stubs (src/tooluniverse/tools/) must produce
# exactly the committed files. If this gate fails, a generator change
# landed without its regeneration commit -- every downstream checkout
# would go dirty with thousands of phantom modifications the moment it
# runs the CLI.
#
# ruff is pinned to the pre-commit rev (.pre-commit-config.yaml) because
# formatting output differs across ruff versions; an unpinned formatter
# would fail this gate spuriously.
#
# To fix a failure locally:
#   pip install ruff==0.14.7
#   python scripts/build_tools.py --force
#   git add src/tooluniverse/tools && git commit
name: Stub Drift Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stub-drift:
    name: Regenerated stubs match committed state
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package and pinned formatter
        # Base install only -- the generator needs the package importable,
        # not the test/dev toolchain. ruff must match the pre-commit pin.
        run: uv pip install -e . ruff==0.14.7 --system

      - name: Regenerate all stubs
        run: python scripts/build_tools.py --force

      - name: Fail on drift
        run: |
          drift="$(git status --porcelain -- src/tooluniverse/tools)"
          if [ -n "$drift" ]; then
            echo "::error::Generated stubs drifted from the committed state."
            echo "A generator change landed without its regeneration commit."
            echo "Fix locally: pip install ruff==0.14.7 &&" \
                 "python scripts/build_tools.py --force," \
                 "then commit src/tooluniverse/tools."
            echo
            echo "Drifted files:"
            echo "$drift"
            echo
            git diff --stat -- src/tooluniverse/tools | tail -20
            exit 1
          fi
          echo "Stubs are in sync with the generator."
